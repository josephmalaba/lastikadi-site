<!--
  THE PAGE THIS LOADER BELONGS TO, named by the source name and rewritten by
  scripts/emit-dist.mjs to the content-addressed name the build actually emitted. It is an
  `href` because the rewriter handles one exactly; a query parameter is captured only as far
  as the question mark and a data attribute is not a reference form at all. Both were tried
  and both are recorded in the build's history rather than in a comment nobody can check: the
  first attempt emitted a loader with the page name gone, the second emitted a name the build
  had already renamed.
-->
<link rel="preload" as="document" data-role="page" href="./page.e8218211.html">
</head>
<body>
<main>
  <p>Opening the game…</p>
  <noscript>This game needs JavaScript. Turn it on and scan the code again.</noscript>
</main>
<!--
  THE LOADER AT THE STABLE ADDRESS, and the only file in this client that is not
  content-addressed by name.

  `/play/` is what a printed code and a venue scan point at, so it has to keep working across
  a rebuild and it cannot carry a tag in its name. Measured live on 2026-10-04, that address
  is served `Cache-Control: max-age=600`, so a phone can answer a scan by running a
  ten-minute-old client — and the build before this one fell into offline practice on a link
  it could not serve, which makes a stale copy a WRONG copy rather than merely an old one.

  So this document holds no game, opens no account and contacts nothing. It names the real
  page by its content-addressed name — the preload link in the head, rewritten by the build —
  and play/boot.mjs fetches that name with `cache: 'no-store'` and hands the document over.
  The bytes that decide what this client does are therefore always the bytes of a name that
  changed when they changed; a stale copy of THIS file can only be stale about a filename, and
  the filename it names is stamped into it by the same build that stamped the page.

  Nothing here reads the game, the rules version or the table — those are on the scanned
  address and are read by the page.
-->
<script type="module" src="./boot.51c1e15b.mjs"></script>
</body>
</html>
