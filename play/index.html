<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#18261D">
<title>LastiKadi — Play Kadi</title>
<link rel="manifest" href="./site.0e8d4a4e.webmanifest">
<link rel="icon" href="/assets/brand/lastikadi-logo-192.788cee43.png">
<link rel="apple-touch-icon" href="/assets/brand/lastikadi-logo-192.788cee43.png">
<style>
:root{--bg:#18261D;--panel:#1F332A;--panel2:#263D31;--gold:#D9A93C;--gold-hi:#F0C766;
--cream:#F2E9D6;--dim:#9FB3A6;--line:#3A5346;--danger:#C4553F;--ok:#5AA469}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--cream);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;min-height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:17px;margin:0;letter-spacing:.3px}
header .brand{color:var(--gold);font-weight:700}
header .spacer{flex:1}
.pill{border:1px solid var(--line);background:var(--panel2);color:var(--cream);border-radius:999px;
padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.pill:hover{border-color:var(--gold)}
.pill[disabled]{opacity:.45;cursor:not-allowed}
.mode{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
main{flex:1;display:flex;flex-direction:column;gap:12px;padding:12px;max-width:1100px;margin:0 auto;width:100%}
.table{flex:1;min-height:220px;border:1px solid var(--line);border-radius:14px;
background:radial-gradient(120% 90% at 50% 0%,#24402F 0%,#1B2C22 55%,#16241C 100%);
position:relative;display:flex;align-items:center;justify-content:center;padding:16px}
.tablecenter{display:flex;flex-direction:column;align-items:center;gap:14px}
.status{font-size:14px;color:var(--dim);text-align:center;min-height:20px}
.status.alert{color:var(--gold-hi)}
.status.bad{color:var(--danger)}
.directive{font-size:13px;color:var(--gold);text-align:center;min-height:18px}
.opp{position:absolute;top:10px;left:14px;font-size:13px;color:var(--dim)}
.deck{position:absolute;top:10px;right:14px;font-size:13px;color:var(--dim)}
.hand{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-end;min-height:132px}
.card{width:74px;height:108px;border-radius:9px;background:var(--cream);color:#1B2C22;border:2px solid #00000022;
box-shadow:0 3px 10px #0006;position:relative;display:flex;flex-direction:column;justify-content:space-between;
padding:6px 7px;cursor:pointer;transition:transform .09s ease;user-select:none}
.card:hover{transform:translateY(-6px)}
.card.playable{outline:2px solid var(--gold);outline-offset:2px}
/* A card the authority has not judged: offered as a request, never claimed as legal. */
.card.attempt{outline:2px dashed var(--line);outline-offset:2px;cursor:pointer}
.card.attempt:hover{transform:translateY(-6px)}
.card.attempt::after{content:'ask';position:absolute;top:4px;right:5px;font-size:8px;letter-spacing:.06em;
color:#1B2C2277;text-transform:uppercase}
.banner{background:var(--danger);color:#FFF4EF;font-size:13px;font-weight:600;line-height:1.35;
padding:9px 14px;text-align:center}
.banner[hidden]{display:none}
.card.wild{outline:2px dashed var(--gold-hi);outline-offset:2px}
.card.dim{opacity:.42;cursor:not-allowed}
.card.dim:hover{transform:none}
.card .rank{font-size:20px;font-weight:700;line-height:1}
.card .family{font-size:11px;font-weight:600}
.card .glyph{font-size:26px;align-self:center}
.card .name{font-size:9px;color:#1B2C2255;text-align:center}
.card.red{color:#A8322A}.card.black{color:#1B2C22}
.card.joker{background:linear-gradient(135deg,#F2E9D6 0%,#E4D3AE 100%)}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-bottom:4px;align-items:center}
button.act{background:var(--gold);color:#20170A;border:0;border-radius:10px;padding:11px 18px;font-size:15px;
font-weight:650;cursor:pointer;font-family:inherit}
button.act:hover{background:var(--gold-hi)}
button.act[disabled]{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--cream);border:1px solid var(--line)}
button.ghost:hover{border-color:var(--gold)}
.families{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.winner{font-size:22px;color:var(--gold);text-align:center}
.a11y{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
footer{padding:8px 14px;font-size:12px;color:var(--dim);text-align:center;border-top:1px solid var(--line)}
@media (max-width:420px){.card{width:58px;height:88px}.card .rank{font-size:16px}.card .glyph{font-size:20px}}
/* A phone held sideways is 360px tall and the three min-heights below (220 + 132) plus the
   chrome come to 587px, so the controls, the hand and the footer are pushed off the bottom.
   The page scrolls rather than clipping them, so nothing is lost — but a guest should not
   have to scroll to reach the cards. Measured at 740x360: document 587 vs viewport 360.
   The floors shrink here so the table fits without scrolling. */
@media (max-height:460px){
  .table{min-height:120px}
  .hand{min-height:84px}
  .card{width:52px;height:78px}
  .card .rank{font-size:15px}.card .glyph{font-size:18px}
  header{padding:6px 10px}
  main{gap:6px;padding:6px}
  footer{padding:4px 10px}
}
</style>
</head>
<body>
<header>
  <span class="brand">LastiKadi</span>
  <h1 id="surface">Reading the link…</h1>
  <span class="mode" id="mode">checking</span>
  <span class="spacer"></span>
  <button class="pill" id="btn-new">New table</button>
  <button class="pill" id="btn-offline" title="Play a practice game on this phone only. No table is opened and nothing reaches the server.">Practise offline</button>
</header>
<div class="banner" id="banner" hidden></div>

<main>
  <section class="table" aria-label="Table">
    <div class="opp" id="opp">Machine — 6 cards</div>
    <div class="deck" id="deck">Deck — 41</div>
    <div class="tablecenter">
      <div class="status" id="status" role="status" aria-live="polite">Starting⬦</div>
      <div class="directive" id="directive"></div>
      <div id="pile" aria-label="Top card"></div>
    </div>
  </section>
  <div class="controls" id="controls"></div>
  <div class="hand" id="hand" aria-label="Your hand"></div>
</main>

<footer>
  Free to play. No prizes. No wagering. Rules by the canonical Kadi engine —
  the same engine the Android app uses.
</footer>
<div class="a11y" id="live" aria-live="polite"></div>

<script src="./kadi-runtime-browser.8e8a5365.js"></script>
<script type="module">
import { GameHost, LocalAuthority, NetworkAuthority } from './host.e30228b1.mjs';
import { SERVED, planForLink, planForRuntime } from './identity.17b1dc91.mjs';
import { OUTCOMES, SERVICE_BASE, joinVenue } from './session.005e630e.mjs';

/** The offline engine's own seat LABELS. They are not account ids and never leave this phone. */
const OFFLINE_HUMAN = 1, OFFLINE_MACHINE = 2;

/*
 * WHICH GAME AND RULES VERSION THIS PAGE WAS OPENED FOR.
 *
 * Decided once, from this page's own address, before anything is dealt — not from a
 * constant in this file. The venue display puts the identity it selected into the scan
 * code (`?game=kadi&v=0.0.3`); this is the code that reads it, and the rules about what
 * happens when it is absent, unknown or a different version live in ./identity.17b1dc91.mjs so
 * they are tested rather than inspected.
 *
 * There is deliberately no default game here. A link that names nothing this client can
 * serve deals nothing, and says so. That is the same standard the venue screen already
 * meets: a game it cannot vouch for is drawn named and unpressable rather than offered.
 */
let identity = planForLink(location.search);

/**
 * This browser's own storage, so a second scan opens a new table instead of a new account.
 */
const store = {
  get: (k) => { try { return localStorage.getItem('venue.' + k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem('venue.' + k, String(v)); } catch { /* private mode */ } },
  remove: (k) => { try { localStorage.removeItem('venue.' + k); } catch { /* private mode */ } },
};

const SUITS = {
  Heart: { glyph: '\u2665', red: true }, Kisu: { glyph: '\u2666', red: true },
  Mavi: { glyph: '\u2663', red: false }, Spade: { glyph: '\u2660', red: false },
  Joker: { glyph: '\u2605', red: false },
};
const SPECIALS = {
  '2': 'adds 2 to the penalty', '7': 'blocks the next player', '8': 'turns the table',
  'J': 'goes anywhere, names what follows', Joker: 'wipes the penalty, adds 5 — only a Joker answers it',
};
const $ = (id) => document.getElementById(id);
const Ctor = (typeof KadiRuntime !== 'undefined' && KadiRuntime.KadiRuntimeJs) || null;

let host = null, authority = null, view = null, busy = false;
/* The table this page is at, and whose seat it holds. Null while there is no table. */
let table = null, offline = false, mySeat = OFFLINE_HUMAN;

/**
 * What mode the screen is in, said unmistakably and before any card is dealt.
 *
 * Offline practice used to be reached by a FAILED network attempt and looked exactly like
 * the venue game: the same header, the same "Practice" word, no sign that nothing had
 * reached the server. A guest played, believed he had played, and no table existed. So the
 * word OFFLINE is on the surface, the mode pill, and a banner that cannot be missed —
 * all three, set before the first deal, and none of them reachable without a deliberate
 * press on a control that says what it does.
 */
function paintMode() {
  $('surface').textContent = identity.title;
  $('mode').textContent = offline
    ? 'offline practice · nothing reaches the server'
    : 'the table service · rules v' + identity.ruleVersion;
  const banner = $('banner');
  banner.hidden = !offline;
  banner.textContent = offline
    ? 'OFFLINE PRACTICE — this is NOT the venue game. It runs on this phone alone: no table was opened, no move is recorded, and nothing was sent anywhere.'
    : '';
  $('btn-new').textContent = offline ? 'Deal again' : 'New table';
  $('btn-offline').disabled = offline;
  $('btn-offline').textContent = offline ? 'Offline' : 'Practise offline';
}

/** Offline practice, entered only by an explicit press. Never by a failure. */
function startOffline() {
  offline = true; table = null; mySeat = OFFLINE_HUMAN;
  authority = new LocalAuthority(Ctor, {
    gameId: identity.engineGameId, entropy: String(Date.now()), human: OFFLINE_HUMAN, machine: OFFLINE_MACHINE,
  });
  host = new GameHost(authority, { localSeat: OFFLINE_HUMAN });
  paintMode();
  return host.start();
}

/**
 * The venue: sign in, find this phone's own account, open a table of it and the
 * commissioned machine seat, and read that table back. Nothing here falls back anywhere.
 */
async function startVenue() {
  const game = SERVED[identity.game];
  const joined = await joinVenue(fetch.bind(globalThis), SERVICE_BASE, store, game);
  if (joined.outcome !== OUTCOMES.OPEN) return failVenue(joined);
  offline = false;
  table = joined.table;
  mySeat = table.accountId;
  authority = new NetworkAuthority(SERVICE_BASE, { token: joined.session.token, table });
  host = new GameHost(authority, { localSeat: mySeat });
  paintMode();
  await host.start();
  return null;
}

/** Why the service refused, in its own terms — never guessed, and never about the network. */
const WHY = Object.freeze({
  [OUTCOMES.NO_ACCOUNT]: 'The table service would not start a session for this phone.',
  [OUTCOMES.ID_UNKNOWN]: 'This phone could not establish which account it is, so it cannot claim a seat.',
  [OUTCOMES.SEAT_REFUSED]: 'The table service refused a seat at the table this client asked for.',
  [OUTCOMES.UNREACHABLE]: 'The table service did not answer.',
});

/**
 * No table was opened. NOTHING is dealt, and the reason given is the service's own.
 *
 * The sentence this replaced said "the game server is not reachable" for every failure.
 * That was false — /readiness answered 200 the whole time — and it pointed everyone who
 * read it at the network instead of at the client. So an unreachable outcome is CHECKED
 * against /readiness before it is reported, and the two facts are kept apart.
 */
async function failVenue(joined) {
  offline = false; table = null; host = null; authority = null; view = null;
  paintMode();
  $('surface').textContent = identity.title;
  $('mode').textContent = 'no table open';
  const st = $('status');
  st.className = 'status bad';

  let sentence = WHY[joined.outcome] || 'The table could not be opened.';
  if (joined.error) sentence += ' The service said: ' + joined.error;
  if (joined.outcome === OUTCOMES.UNREACHABLE) {
    let up = null;
    try {
      const probe = await fetch(SERVICE_BASE + '/readiness', { method: 'GET' });
      const body = await probe.json().catch(() => null);
      up = probe.status === 200 && body && body.status === 'UP';
    } catch { up = false; }
    sentence += up
      ? ' Its readiness endpoint answers UP, so the service is running: this is a fault in this client, not an outage.'
      : ' Its readiness endpoint does not answer UP either, so the service itself is not ready.';
  }
  sentence += ' No game was dealt.';
  st.textContent = sentence;
  $('directive').textContent = '';
  $('opp').textContent = '';
  $('deck').textContent = '';
  $('pile').textContent = '';
  $('hand').textContent = '';
  $('controls').textContent = '';
  $('btn-new').disabled = true;
  $('live').textContent = sentence;
}

/*
 * A link this client cannot serve.
 *
 * Everything that could start a game is taken away rather than left inert: the table is
 * emptied, the hand and the pile are cleared, and both header controls are disabled.
 * Nothing here deals, and nothing here is a fallback to some other game — the refusal
 * names what was asked for and what this client does serve, and that is the whole answer.
 */
function refuseIdentity(plan) {
  identity = plan;
  host = null;
  authority = null;
  view = null;
  offline = true;   // so paintMode() clears the banner and disables the mode control below
  const st = $('status');
  st.className = 'status bad';
  st.textContent = plan.note;
  $('surface').textContent = plan.title;
  $('mode').textContent = 'nothing opened';
  $('directive').textContent = plan.detail;
  $('opp').textContent = '';
  $('deck').textContent = '';
  $('pile').textContent = '';
  $('hand').textContent = '';
  $('controls').textContent = '';
  $('banner').hidden = true;
  $('banner').textContent = '';
  $('btn-new').disabled = true;
  $('btn-new').textContent = 'New table';
  $('btn-offline').disabled = true;
  $('btn-offline').textContent = 'Practise offline';
  $('live').textContent = plan.title + '. ' + plan.note;
}

async function refresh(note, alert) {
  if (!host) { render(note, alert); return; }
  view = await host.view();
  render(note, alert);
}

async function act(action, args) {
  if (busy || !host) return;
  busy = true;
  const r = await host.act(action, args);
  busy = false;
  if (!r.ok) { await refresh(r.error || 'That move was refused.', true); return; }
  await refresh();
}

function cardEl(card, state) {
  const suit = SUITS[card.family] || SUITS.Spade;
  const d = document.createElement('div');
  const playable = state === 'playable', wild = state === 'wild';
  /*
   * `attempt` is the state a card is in when the authority has NOT said whether it may be
   * played. The table service publishes no legal-card list, so on the venue path the client
   * cannot mark a card legal or illegal without inventing a rule — so it marks it as a
   * REQUEST, and the engine's own answer is what the guest is shown. Marking these `dim`
   * would be the same lie in the other direction: it would claim the card is not playable.
   */
  const attempt = state === 'attempt';
  d.className = 'card ' + (suit.red ? 'red' : 'black') + (card.symbol === 'Joker' ? ' joker' : '') +
    (playable ? ' playable' : wild ? ' wild' : attempt ? ' attempt' : ' dim');
  const special = SPECIALS[card.symbol];
  d.setAttribute('role', 'button');
  d.setAttribute('tabindex', (playable || wild || attempt) ? '0' : '-1');
  d.setAttribute('aria-label', card.cardName.replace(/_/g, ' ') + (special ? ' — ' + special : '') +
    (wild ? ' (needs a family named)' : '') + (attempt ? ' — ask the table service to play this' : ''));
  d.innerHTML = '<div class="rank">' + card.symbol + '</div><div class="glyph">' + suit.glyph +
    '</div><div class="family">' + card.family + '</div><div class="name">' +
    card.cardName.replace(/_/g, ' ') + '</div>';
  if (playable || attempt) d.addEventListener('click', () => act('play', { cardName: card.cardName }));
  if (wild) d.addEventListener('click', () => showFamilyPicker(card.cardName));
  d.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    if (playable || attempt) act('play', { cardName: card.cardName });
    if (wild) showFamilyPicker(card.cardName);
  });
  return d;
}

function showFamilyPicker(cardName) {
  const ctl = $('controls'); ctl.innerHTML = '';
  const label = document.createElement('div');
  label.className = 'winner'; label.style.fontSize = '15px';
  label.textContent = 'Name a family for your ' + (cardName.includes('Joker') ? 'Joker' : 'Jack');
  ctl.appendChild(label);
  const row = document.createElement('div'); row.className = 'families';
  for (const f of LocalAuthority.JACK_CALLS) {
    const b = document.createElement('button');
    b.className = 'act'; b.textContent = f;
    b.addEventListener('click', () => act('play', { cardName, requestedFamily: f }));
    row.appendChild(b);
  }
  ctl.appendChild(row);
  const cancel = document.createElement('button');
  cancel.className = 'act ghost'; cancel.textContent = 'Cancel';
  cancel.addEventListener('click', () => render());
  ctl.appendChild(cancel);
}

function render(note, bad) {
  const v = view;
  if (!v) return;
  // The opponent's seat is an account id on the venue path and the engine's own label
  // offline; `mySeat` is whichever this screen is holding, so the two are never mixed up.
  const opponentSeat = offline ? OFFLINE_MACHINE : (table ? table.machineId : null);
  $('opp').textContent = 'Machine — ' + (v.counts && opponentSeat !== null ? (v.counts[String(opponentSeat)] ?? '?') : '?') + ' cards';
  $('deck').textContent = 'Deck — ' + (v.drawCount ?? '?');

  const st = $('status');
  if (v.over) { st.className = 'status'; st.textContent = ''; }
  else if (bad && note) { st.className = 'status bad'; st.textContent = note; }
  else if (note) { st.className = 'status alert'; st.textContent = note; }
  else if (v.mustAnnounce) { st.className = 'status alert'; st.textContent = 'One card left — announce it before you play.'; }
  else if (v.choosingFamily) { st.className = 'status alert'; st.textContent = 'Your Jack names what comes next.'; }
  else if (v.blocked) { st.className = 'status alert'; st.textContent = 'Blocked. Answer with the same card or pass.'; }
  else if (v.penalty > 0) { st.className = 'status alert'; st.textContent = 'You owe a penalty of ' + v.penalty + '. Draw, or add to it.'; }
  else if (v.turnHasPlayed) { st.className = 'status'; st.textContent = 'You have played. Play another of the same value, or finish your turn.'; }
  else if (v.isTurn) { st.className = 'status'; st.textContent = 'Your turn.'; }
  else { st.className = 'status'; st.textContent = 'Waiting for the machine⬦'; }

  const dir = [];
  if (v.requestedFamily && v.requestedFamily !== 'CHOICE') dir.push('Requested: ' + v.requestedFamily);
  if (v.direction === -1) dir.push('Direction reversed');
  // Honest about what this authority told us: a client that cannot see the legal list says
  // so rather than colouring the cards as though it knew.
  if (v.legalReported === false && !v.over) dir.push('the service does not list legal cards, so a card is a request — it will answer');
  $('directive').textContent = dir.join('  ·  ');

  const pile = $('pile'); pile.innerHTML = '';
  if (v.topCard) pile.appendChild(cardEl(v.topCard, 'top'));

  const hand = $('hand'); hand.innerHTML = '';
  const playableSet = new Set(v.legalCards || []);
  const wildSet = new Set(v.wildCards || []);
  for (const name of v.hand) {
    const parts = name.startsWith('Joker') ? { family: 'Joker', symbol: 'Joker' }
      : { family: name.split('_')[0], symbol: name.split('_')[1] };
    const state = v.over ? 'top'
      : playableSet.has(name) ? 'playable'
        : wildSet.has(name) ? 'wild'
          : v.legalReported === false ? 'attempt'
            : 'dim';
    hand.appendChild(cardEl({ cardName: name, family: parts.family, symbol: parts.symbol }, state));
  }

  const ctl = $('controls'); ctl.innerHTML = '';
  const btn = (label, fn, ghost, enabled = true) => {
    const b = document.createElement('button');
    b.className = 'act' + (ghost ? ' ghost' : '');
    b.textContent = label; b.disabled = !enabled;
    if (enabled && fn) b.addEventListener('click', fn);
    ctl.appendChild(b);
    return b;
  };

  if (v.over) {
    const msg = document.createElement('div');
    msg.className = 'winner';
    msg.textContent = v.winnerId === mySeat ? 'You win — Kadi moja!' : 'The machine won this hand.';
    ctl.appendChild(msg);
    btn(offline ? 'Deal again' : 'New table', newRound);
    return;
  }
  if (!v.isTurn) { btn('Machine is thinking⬦', null, true, false); return; }
  if (v.mustAnnounce) { btn('Announce last card', () => act('announceLastCard')); return; }
  if (v.choosingFamily) { showFamilyPicker(''); return; }
  if (v.legalReported === false) {
    // The authority reports no action flags either, so every action is offered as the
    // request it is; the service refuses what is not available and the refusal is shown.
    btn('Draw a card', () => act('draw'), v.turnHasPlayed);
    btn('Finish turn', () => act('finish'), !v.turnHasPlayed);
    btn('Pass', () => act('pass'));
    return;
  }
  if (v.canFinish) btn('Finish turn', () => act('finish'), !v.legalCards.length);
  if (v.canDraw) btn('Draw a card', () => act('draw'), v.legalCards.length > 0 || v.wildCards.length > 0);
  if (v.canPass) btn('Pass', () => act('pass'));
}

/**
 * A new round. On the venue path that is a NEW TABLE — "each gets his own game" — and
 * offline it is a fresh deal on this phone. Neither is ever reached by a failure.
 */
async function newRound() {
  if (busy) return;
  busy = true;
  $('status').className = 'status';
  $('status').textContent = offline ? 'Dealing⬦' : 'Opening a table at the service⬦';
  try {
    if (offline) { await startOffline(); } else { await startVenue(); }
    if (host) await refresh();
    else render();
  } catch (e) {
    await failVenue({ outcome: OUTCOMES.SEAT_REFUSED, error: (e && e.message) || 'unknown' });
  }
  busy = false;
}

$('btn-new').addEventListener('click', newRound);

/*
 * The offline control. It is a MODE, not a fallback: it is present before anything has
 * failed, it says what it does, and pressing it repaints the whole screen as offline
 * BEFORE a single card is dealt.
 */
$('btn-offline').addEventListener('click', async () => {
  if (!identity.ok || offline || busy) return;
  busy = true;
  await startOffline();
  await refresh();
  busy = false;
});

try {
  if (!identity.ok) {
    refuseIdentity(identity);
  } else {
    $('surface').textContent = identity.title;
    if (!Ctor) throw new Error('the canonical Kadi runtime did not load');
    // The loaded engine gets a vote on the version it will play, before the venue is
    // contacted. It is a fact about the bytes this page serves, so it is checked here.
    const probe = new Ctor(identity.engineGameId, String(Date.now()), OFFLINE_HUMAN, OFFLINE_MACHINE);
    const afterEngine = planForRuntime(identity, JSON.parse(probe.identityJson()));
    if (!afterEngine.ok) refuseIdentity(afterEngine);
    else {
      $('status').className = 'status';
      $('status').textContent = 'Opening your table at the service⬦';
      await startVenue();
      if (host) await refresh();
      else render();
    }
  }
} catch (e) {
  await failVenue({ outcome: OUTCOMES.SEAT_REFUSED, error: (e && e.message) || 'unknown' });
}
</script>
</body>
</html>
